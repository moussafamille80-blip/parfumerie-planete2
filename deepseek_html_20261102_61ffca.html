<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Parfumerie Planète 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --violet: #6A1B9A; --rose: #E91E63; }
        body { background: #F5F3F7; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background: #2D1B3D; min-height: 100vh; }
        .sidebar a { color: #fff; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background: #4A2D5C; border-left: 4px solid var(--rose); }
        .card-stat { border: none; border-radius: 16px; transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-4px); }
        .table thead { background: var(--violet); color: white; }
        .btn-primary { background: var(--violet); border: none; }
        .btn-primary:hover { background: #4A148C; }
        .text-violet { color: var(--violet); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar p-0">
            <div class="text-center py-4">
                <h1>🌸</h1>
                <h5 class="text-white">PLANÈTE 2</h5>
                <small class="text-white-50">Parfumerie • Stock</small>
            </div>
            <a href="/"><i class="bi bi-speedometer2"></i> Tableau de bord</a>
            <a href="/produits"><i class="bi bi-bottle"></i> Produits</a>
            <a href="/mouvement/ENTREE"><i class="bi bi-box-arrow-in-down"></i> Entrées</a>
            <a href="/mouvement/SORTIE"><i class="bi bi-box-arrow-up"></i> Sorties</a>
            <a href="/historique"><i class="bi bi-clock-history"></i> Historique</a>
        </div>
        <div class="col-md-10 p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                {% endfor %}
            {% endwith %}
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
